# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-myrobot"
BBFILE_PATTERN_meta-myrobot = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-myrobot = "6"

LAYERDEPENDS_meta-myrobot = "core"
LAYERSERIES_COMPAT_meta-myrobot = "scarthgap"
